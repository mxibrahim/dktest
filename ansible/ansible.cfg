[defaults]
inventory = inventory/hosts.yml
roles_path = roles
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
forks = 10
# Throttled t3.micro hosts (CPU credits exhausted) plus the SSM hop can take
# well over the 10s default to connect and escalate.
timeout = 60

[ssh_connection]
pipelining = True
# Hosts are ephemeral: trust a new host key on first contact, but still fail
# if a known host's key changes (safer than disabling host key checking).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
