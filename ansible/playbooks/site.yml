- name: Wait for freshly created instances
  hosts: elasticsearch
  gather_facts: false
  tasks:
    # SSH rides on SSM: the agent must register with Systems Manager first,
    # which takes a minute or two after boot.
    - name: Wait for SSH over SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for cloud-init to finish (apt locks)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Base OS hardening and tuning
  hosts: elasticsearch
  become: true
  roles:
    - common

- name: Elasticsearch with TLS and authentication
  hosts: elasticsearch
  become: true
  roles:
    - elasticsearch
