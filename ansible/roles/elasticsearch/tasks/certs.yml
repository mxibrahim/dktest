# One private CA (on the first node) signs a certificate per node. The same
# certs serve the HTTP layer (clients) and the transport layer (node-to-node,
# verified with verification_mode: full).

- name: Create local secrets directory
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true
  become: false

- name: Generate CA and node certificates on {{ es_cert_host }}
  delegate_to: "{{ es_cert_host }}"
  run_once: true
  block:
    - name: Create certgen directory
      ansible.builtin.file:
        path: "{{ es_certgen_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render certificate instances file
      ansible.builtin.template:
        src: instances.yml.j2
        dest: "{{ es_certgen_dir }}/instances.yml"
        mode: "0600"
      register: es_instances_file

    - name: Generate CA
      ansible.builtin.shell: >-
        {{ es_home }}/bin/elasticsearch-certutil ca --pem --silent
        --days {{ es_ca_validity_days }} --out {{ es_certgen_dir }}/ca.zip
        && unzip -o ca.zip
      args:
        chdir: "{{ es_certgen_dir }}"
        creates: "{{ es_certgen_dir }}/ca/ca.crt"

    - name: Check for existing node certificates
      ansible.builtin.stat:
        path: "{{ es_certgen_dir }}/certs.zip"
      register: es_certs_zip

    # certutil resolves relative paths against ES_HOME, not cwd: keep them absolute.
    # Regenerated whenever the node list or addresses change.
    - name: Generate node certificates
      ansible.builtin.shell: >-
        rm -f certs.zip
        && {{ es_home }}/bin/elasticsearch-certutil cert --pem --silent
        --ca-cert {{ es_certgen_dir }}/ca/ca.crt --ca-key {{ es_certgen_dir }}/ca/ca.key
        --in {{ es_certgen_dir }}/instances.yml --days {{ es_cert_validity_days }}
        --out {{ es_certgen_dir }}/certs.zip
        && unzip -o certs.zip
      args:
        chdir: "{{ es_certgen_dir }}"
      when: es_instances_file is changed or not es_certs_zip.stat.exists

    # Read into memory only: node private keys never touch the control machine.
    - name: Read certificates and keys
      ansible.builtin.slurp:
        src: "{{ es_certgen_dir }}/{{ item }}"
      loop: >-
        {{ ['ca/ca.crt']
           + (es_nodes | map('regex_replace', '^(.*)$', '\1/\1.crt') | list)
           + (es_nodes | map('regex_replace', '^(.*)$', '\1/\1.key') | list) }}
      register: es_cert_files
      no_log: true

- name: Save CA certificate locally for clients
  ansible.builtin.copy:
    content: "{{ es_cert_files.results | selectattr('item', 'equalto', 'ca/ca.crt') | map(attribute='content') | first | b64decode }}"
    dest: "{{ secrets_dir }}/ca.crt"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  become: false

- name: Remove certificates auto-generated by the package
  ansible.builtin.file:
    path: "{{ es_certs_dir }}/{{ item }}"
    state: absent
  loop: [http_ca.crt, http.p12, transport.p12]

- name: Install node TLS material
  ansible.builtin.copy:
    content: "{{ es_cert_files.results | selectattr('item', 'equalto', item.src) | map(attribute='content') | first | b64decode }}"
    dest: "{{ es_certs_dir }}/{{ item.dest }}"
    owner: root
    group: elasticsearch
    mode: "{{ item.mode }}"
  diff: false
  loop:
    - { src: ca/ca.crt, dest: ca.crt, mode: "0644" }
    - { src: "{{ inventory_hostname }}/{{ inventory_hostname }}.crt", dest: node.crt, mode: "0644" }
    - { src: "{{ inventory_hostname }}/{{ inventory_hostname }}.key", dest: node.key, mode: "0640" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart elasticsearch
