- name: Set hostname to the node name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden sshd (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Create swap file
  ansible.builtin.command: >-
    bash -c 'fallocate -l {{ common_swap_size_mb }}M /swapfile &&
    chmod 600 /swapfile && mkswap /swapfile'
  args:
    creates: /swapfile
  register: common_swapfile

- name: Enable swap file
  ansible.builtin.command: swapon /swapfile
  when: common_swapfile is changed

- name: Persist swap file
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Kernel settings for Elasticsearch
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-elasticsearch.conf
    reload: true
  loop:
    - { name: vm.max_map_count, value: "262144" } # mmapfs needs many mappings
    - { name: vm.swappiness, value: "1" }         # swap only to avoid OOM
